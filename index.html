<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2a2a2e">
  <meta name="description" content="Cube Crash - Aplasta cubos 3D">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="192.png">
  <link rel="apple-touch-icon" href="192.png">
  <title>Cube Crash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="c"></canvas>

  <!-- HUD -->
  <div class="hud">
    <div class="level-bar">
      <div class="level-bar__fill"></div>
      <div class="level-bar__text">Nivel 1 · 0%</div>
    </div>

    <div class="hud__top">
      <div class="hud__score">
        <div class="score-lbl"></div>
        <div class="cube-count-lbl"></div>
      </div>
      <div class="hud__right">
        <div class="coins-lbl"><img src="data/images/coin.png" class="coin-icon" alt=""> <span class="coins-val">0</span></div>
        <div class="lives-lbl" style="display:none">❤️❤️❤️</div>
        <div class="pause-btn"><div></div></div>
      </div>
    </div>

    <div class="slowmo">
      <div class="slowmo__bar"></div>
    </div>
  </div>

  <!-- Achievement Toast -->
  <div class="ach-toast" id="achToast">
    <div class="ach-toast__icon">🏆</div>
    <div class="ach-toast__body">
      <div class="ach-toast__title">Logro desbloqueado</div>
      <div class="ach-toast__name"></div>
    </div>
  </div>

  <!-- Menus -->
  <div class="menus">
    <!-- MAIN -->
    <div class="menu menu--main">
      <div class="main-logo">
        <h1>Cube Crash</h1>
        <p class="tagline">Aplasta. Rompe. Domina.</p>
      </div>

      <div class="main-coins">
        <img src="data/images/coin.png" class="coin-icon" alt=""> <span class="main-coins-val">0</span>
      </div>

      <div class="main-btns">
        <button type="button" class="btn btn-primary play-modes-btn">Jugar</button>
        <button type="button" class="btn shop-btn">Tienda</button>
        <button type="button" class="btn achievements-btn">Logros</button>
      </div>

      <div class="credits">Oscar Antonio Alvarez Collado</div>
    </div>

    <!-- MODE SELECT -->
    <div class="menu menu--modes">
      <h2 class="menu-title">Elige un modo</h2>
      <div class="mode-grid">
        <button type="button" class="mode-card" data-mode="ranked">
          <div class="mode-card__name">Clásico</div>
          <div class="mode-card__desc">Endless con niveles, monedas y logros</div>
        </button>
        <button type="button" class="mode-card" data-mode="casual">
          <div class="mode-card__name">Casual</div>
          <div class="mode-card__desc">Sin morir · Solo contador de cubos</div>
        </button>
        <button type="button" class="mode-card" data-mode="hearts">
          <div class="mode-card__name">Hearts</div>
          <div class="mode-card__desc">3 vidas · Niveles y puntuación</div>
        </button>
        <button type="button" class="mode-card" data-mode="desafiante">
          <div class="mode-card__name">Desafiante</div>
          <div class="mode-card__desc">Más cubos · x2 monedas · Más difíciles</div>
        </button>
        <button type="button" class="mode-card mode-card--locked" data-mode="legend">
          <div class="mode-card__name">Legend</div>
          <div class="mode-card__desc">En desarrollo. ¡Gracias por jugar!</div>
        </button>
      </div>
      <button type="button" class="btn btn-back modes-back-btn">← Volver</button>
    </div>

    <!-- PAUSE -->
    <div class="menu menu--pause">
      <h2 class="menu-title">Pausa</h2>
      <div class="main-btns">
        <button type="button" class="btn btn-primary resume-btn">Reanudar</button>
        <button type="button" class="btn shop-btn--pause">Tienda</button>
        <button type="button" class="btn achievements-btn--pause">Logros</button>
        <button type="button" class="btn menu-btn--pause">Salir al Menú</button>
      </div>
    </div>

    <!-- SCORE / GAME OVER -->
    <div class="menu menu--score">
      <h2 class="menu-title">Fin de partida</h2>
      <div class="final-score-lbl">0</div>
      <div class="high-score-lbl"></div>
      <div class="level-reached-lbl"></div>
      <div class="main-btns">
        <button type="button" class="btn btn-primary play-again-btn">Reintentar</button>
        <button type="button" class="btn menu-btn--score">Salir al Menú</button>
      </div>
    </div>

    <!-- SHOP -->
    <div class="menu menu--shop">
      <h2 class="menu-title">Tienda</h2>
      <div class="shop-coins">
        <img src="data/images/coin.png" class="coin-icon" alt=""> <span class="shop-coins-value">0</span>
      </div>
      <div class="shop-item" data-item="slowmo">
        <div class="shop-item__info">
          <div class="shop-item__name">Slow-Mo +1s</div>
          <div class="shop-item__desc">Duración: <span class="slowmo-duration-val">1.5</span>s / 60s</div>
        </div>
        <button type="button" class="btn shop-buy-btn" data-item="slowmo">10</button>
      </div>
      <button type="button" class="btn shop-close-btn">Cerrar</button>
    </div>

    <!-- ACHIEVEMENTS -->
    <div class="menu menu--achievements">
      <h2 class="menu-title">Logros</h2>
      <div class="ach-list" id="achList"></div>
      <button type="button" class="btn ach-back-btn">← Volver</button>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
